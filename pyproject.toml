[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "stickman-studio-ai"
version = "0.3.0"
description = "Deterministic text-to-stickman video renderer and agent skill"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "pydantic>=2"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
stickman = "stickman_studio.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
